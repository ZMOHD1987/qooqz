<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Products Debug Test</title>
<link rel="stylesheet" href="/admin/assets/css/pages/products.css">
</head>
<body style="background:#0f1724;color:#e2e8f0;font-family:sans-serif;margin:0;padding:20px;">

<!-- Mock API responses -->
<script>
// Mock fetch to return test data
const originalFetch = window.fetch;
window.fetch = function(url, options) {
    const urlStr = typeof url === 'string' ? url : url.toString();
    
    // Mock categories API
    if (urlStr.includes('/api/categories')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            message: "OK",
            data: {
                items: [
                    {id: 53, tenant_id: 1, parent_id: null, slug: "mango", name: "مانجو", is_active: 1},
                    {id: 54, tenant_id: 1, parent_id: 53, slug: "electronics", name: "الإلكترونيات", is_active: 1},
                    {id: 57, tenant_id: 1, parent_id: null, slug: "bvcc", name: "Bvfffggg", is_active: 1},
                    {id: 7, tenant_id: 1, parent_id: 57, slug: "clothes", name: "ملابس رجالية", is_active: 1},
                    {id: 10, tenant_id: 1, parent_id: null, slug: "tshirts", name: "تيشيرتات", is_active: 1}
                ],
                meta: { total: 5, page: 1, per_page: 1000 }
            }
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock product types
    if (urlStr.includes('/api/product_types')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: { data: [{id: 1, code: 'simple', name: 'Simple'}, {id: 2, code: 'variable', name: 'Variable'}], total: 2 }
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock brands
    if (urlStr.includes('/api/brands')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: [{id: 1, name: 'Brand A'}, {id: 2, name: 'Brand B'}]
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock currencies
    if (urlStr.includes('/api/currencies')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: [{code: 'SAR', name: 'SAR - Saudi Riyal'}, {code: 'USD', name: 'USD - US Dollar'}]
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock attributes
    if (urlStr.includes('/api/product_attributes')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: [{id: 1, slug: 'color', name: 'Color', attribute_type_id: 1, is_variation: 1}, {id: 2, slug: 'size', name: 'Size', attribute_type_id: 1, is_variation: 1}]
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock languages
    if (urlStr.includes('/api/languages')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: { items: [{code: 'ar', name: 'العربية', direction: 'rtl'}, {code: 'en', name: 'English', direction: 'ltr'}] }
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock products list
    if (urlStr.includes('/api/products') && (!options || !options.method || options.method === 'GET')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: {
                items: [
                    {id: 25, name: 'Test Product', sku: 'TST-001', slug: 'test-product', product_type_id: 1, brand_id: 1, tenant_id: 1, is_active: 1, stock_quantity: 10, stock_status: 'in_stock', price: '99.99', currency_code: 'SAR'}
                ],
                meta: { total: 1, page: 1, per_page: 25 }
            }
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock product save
    if (urlStr.includes('/api/products') && options && (options.method === 'POST' || options.method === 'PUT')) {
        console.log('[MOCK] Product save called with:', options.body);
        return Promise.resolve(new Response(JSON.stringify({
            success: true,
            data: { id: 99 },
            message: 'Product saved'
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Mock other product APIs (pricing, etc)
    if (urlStr.includes('/api/product_')) {
        return Promise.resolve(new Response(JSON.stringify({
            success: true, data: { items: [] }
        }), { status: 200, headers: { 'content-type': 'application/json' }}));
    }
    
    // Translations - 404 is OK
    if (urlStr.includes('/languages/Products/')) {
        return Promise.resolve(new Response('', { status: 404 }));
    }
    
    // Default - pass through
    return originalFetch.apply(this, arguments);
};
</script>

<!-- Setup global objects -->

window.AdminFramework = { version: '1.0.1', $: function(id){ return document.getElementById(id); }, notify: function(msg, type) { console.log('[NOTIFY]', type, msg); alert(type + ': ' + msg); } };
window.APP_CONFIG = { TENANT_ID: 1, USER_ID: 7 };
window.USER_LANGUAGE = 'ar';
window.USER_DIRECTION = 'rtl';

<!-- ════════════════ PAGE CONTENT ════════════════ -->
<div class="page-container" id="productsPageContainer" dir="rtl">
    <div class="page-header">
        <div class="page-header-content">
            <h1 class="page-title">Products</h1>
            <p class="page-subtitle">Manage your product catalog</p>
        </div>
        <div class="page-header-actions">
            <button id="btnAddProduct" class="btn btn-primary">
                <i class="fas fa-plus"></i>
                <span>Add Product</span>
            </button>
        </div>
    </div>

    <!-- Form Container -->
    <div id="productFormContainer" class="card form-card" style="display:none">
        <div class="card-header">
            <h3 class="card-title" id="formTitle">Add Product</h3>
            <button type="button" class="btn btn-sm btn-outline" id="btnCloseForm">&times;</button>
        </div>
        <div class="card-body">
            <form id="productForm" novalidate>
                <input type="hidden" id="formId" name="id">
                <input type="hidden" name="csrf_token" value="test123">
                <input type="hidden" id="prodTenantId" name="tenant_id" value="1">

                <div class="form-tabs">
                    <button type="button" class="tab-btn active" data-tab="general">General</button>
                    <button type="button" class="tab-btn" data-tab="pricing">Pricing</button>
                    <button type="button" class="tab-btn" data-tab="inventory">Inventory</button>
                    <button type="button" class="tab-btn" data-tab="attributes">Attributes</button>
                    <button type="button" class="tab-btn" data-tab="categories">Categories</button>
                    <button type="button" class="tab-btn" data-tab="images">Images</button>
                    <button type="button" class="tab-btn" data-tab="translations">Translations</button>
                </div>

                <!-- General Tab -->
                <div class="tab-content" id="tab-general" style="display:block">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodName">Product Name *</label>
                            <input type="text" id="prodName" name="name" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label for="prodSku">SKU</label>
                            <input type="text" id="prodSku" name="sku" class="form-control">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodSlug">Slug</label>
                            <input type="text" id="prodSlug" name="slug" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="prodBarcode">Barcode</label>
                            <input type="text" id="prodBarcode" name="barcode" class="form-control">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodType">Product Type</label>
                            <select id="prodType" name="product_type_id" class="form-control">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodBrand">Brand</label>
                            <select id="prodBrand" name="brand_id" class="form-control">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodMainCategory">Main Category</label>
                            <select id="prodMainCategory" class="form-control">
                                <option value="">Select main category</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodSubCategory">Sub Category</label>
                            <select id="prodSubCategory" class="form-control">
                                <option value="">Select sub category</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodIsActive">Status</label>
                            <select id="prodIsActive" name="is_active" class="form-control">
                                <option value="1">Active</option>
                                <option value="0">Inactive</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodIsFeatured">Featured</label>
                            <select id="prodIsFeatured" name="is_featured" class="form-control">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodIsBestseller">Bestseller</label>
                            <select id="prodIsBestseller" name="is_bestseller" class="form-control">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodIsNew">New</label>
                            <select id="prodIsNew" name="is_new" class="form-control">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Pricing Tab -->
                <div class="tab-content" id="tab-pricing" style="display:none">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodPrice">Price</label>
                            <input type="number" id="prodPrice" name="price" class="form-control" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label for="prodCurrency">Currency</label>
                            <select id="prodCurrency" name="currency_code" class="form-control">
                                <option value="">Loading...</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodComparePrice">Compare Price</label>
                            <input type="number" id="prodComparePrice" name="compare_at_price" class="form-control" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label for="prodCostPrice">Cost Price</label>
                            <input type="number" id="prodCostPrice" name="cost_price" class="form-control" step="0.01" min="0">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="prodTaxRate">Tax Rate (%)</label>
                        <input type="number" id="prodTaxRate" name="tax_rate" class="form-control" step="0.01" min="0" max="100">
                    </div>
                </div>

                <!-- Inventory Tab -->
                <div class="tab-content" id="tab-inventory" style="display:none">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodStockQty">Stock Quantity</label>
                            <input type="number" id="prodStockQty" name="stock_quantity" class="form-control" min="0" value="0">
                        </div>
                        <div class="form-group">
                            <label for="prodLowStock">Low Stock Threshold</label>
                            <input type="number" id="prodLowStock" name="low_stock_threshold" class="form-control" min="0" value="5">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="prodStockStatus">Stock Status</label>
                            <select id="prodStockStatus" name="stock_status" class="form-control">
                                <option value="in_stock">In Stock</option>
                                <option value="out_of_stock">Out of Stock</option>
                                <option value="on_backorder">On Backorder</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="prodManageStock">Manage Stock</label>
                            <select id="prodManageStock" name="manage_stock" class="form-control">
                                <option value="1">Yes</option>
                                <option value="0">No</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="prodAllowBackorder">Allow Backorder</label>
                        <select id="prodAllowBackorder" name="allow_backorder" class="form-control">
                            <option value="0">No</option>
                            <option value="1">Yes</option>
                        </select>
                    </div>
                </div>

                <!-- Attributes Tab -->
                <div class="tab-content" id="tab-attributes" style="display:none">
                    <div class="form-row" style="margin-bottom:12px;">
                        <div class="form-group" style="flex:1">
                            <select id="attrSelect" class="form-control">
                                <option value="">Select attribute</option>
                            </select>
                        </div>
                        <button type="button" id="btnAddAttribute" class="btn btn-secondary">Add Attribute</button>
                    </div>
                    <div id="prodAttributesList"></div>
                </div>

                <!-- Categories Tab -->
                <div class="tab-content" id="tab-categories" style="display:none">
                    <div id="prodCategoriesTree"></div>
                </div>

                <!-- Images Tab -->
                <div class="tab-content" id="tab-images" style="display:none">
                    <button type="button" id="prodSelectImageBtn" class="btn btn-secondary">Select Images</button>
                    <div id="prodImagesPreview" style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;"></div>
                </div>

                <!-- Translations Tab -->
                <div class="tab-content" id="tab-translations" style="display:none">
                    <div class="form-row" style="margin-bottom:12px;">
                        <div class="form-group" style="flex:1">
                            <select id="prodLangSelect" class="form-control">
                                <option value="">Select language</option>
                            </select>
                        </div>
                        <button type="button" id="prodAddLangBtn" class="btn btn-secondary">Add Translation</button>
                    </div>
                    <div id="prodTranslations"></div>
                </div>

                <!-- Physical attributes (hidden) -->
                <input type="hidden" id="prodWeight" name="weight">
                <input type="hidden" id="prodLength" name="length">
                <input type="hidden" id="prodWidth" name="width">
                <input type="hidden" id="prodHeight" name="height">

                <!-- Form Actions -->
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary" id="btnSubmitForm">
                        <i class="fas fa-save"></i>
                        <span>Save</span>
                    </button>
                    <button type="button" class="btn btn-outline" id="btnCancelForm">Cancel</button>
                    <button type="button" id="btnDeleteProduct" class="btn btn-danger" style="display:none">
                        <i class="fas fa-trash"></i> Delete
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Data Table -->
    <div class="card data-card">
        <div class="card-body">
            <div id="tableLoading" class="loading-state">Loading...</div>
            <div id="tableContainer" style="display:none">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>SKU</th>
                            <th>Type</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
            <div class="pagination-wrapper">
                <div class="pagination-info"><span id="paginationInfo">0-0 of 0</span></div>
                <div class="pagination" id="pagination"></div>
            </div>
        </div>
        <div id="emptyState" class="empty-state" style="display:none">
            <div class="empty-icon">📦</div>
            <h3>No Products Found</h3>
        </div>
        <div id="errorState" class="error-state" style="display:none">
            <h3>Error Loading Data</h3>
            <p id="errorMessage"></p>
            <button id="btnRetry" class="btn btn-secondary">Retry</button>
        </div>
    </div>
</div>

<!-- Media Studio Modal -->
<div id="prodMediaStudioModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.7);">
    <button id="prodMediaStudioClose" style="position:absolute;top:10px;right:10px;z-index:10000;">&times;</button>
    <iframe id="prodMediaStudioFrame" style="width:90%;height:90%;margin:5%;border:none;border-radius:12px;"></iframe>
</div>

<input type="hidden" id="tenantFilter">
<input type="hidden" id="typeFilter">
<input type="hidden" id="brandFilter">
<input type="hidden" id="statusFilter">
<button id="btnApplyFilters" style="display:none"></button>
<button id="btnResetFilters" style="display:none"></button>
<span id="resultsCount"></span>
<span id="resultsCountText"></span>
<button id="btnGenerateVariants" style="display:none"></button>
<button id="btnAddVariant" style="display:none"></button>
<div id="prodVariantsList" style="display:none"></div>

<!-- Load products.js -->
<script src="/admin/assets/js/pages/products.js"></script>

</body>
</html>
